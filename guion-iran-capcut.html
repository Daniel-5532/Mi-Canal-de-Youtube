<title>Guion Irán CapCut</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap">
<style>
  /* Layout: una sola columna de tarjetas; cada tarjeta = un capítulo del guion con su botón de copiar. */
  :root {
    --bg: #eef1f5;
    --surface: #ffffff;
    --line: #d5dce6;
    --ink: #14202e;
    --muted: #55657a;
    --accent: #0e6b75;
    --accent-ink: #ffffff;
    --done: #1f7a45;
    --done-bg: #e3f3ea;
    --font-display: "Familjen Grotesk", system-ui, sans-serif;
    --font-text: "Source Serif 4", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1620;
      --surface: #172230;
      --line: #263548;
      --ink: #e7edf5;
      --muted: #97a7bb;
      --accent: #4fc3cf;
      --accent-ink: #06222a;
      --done: #6fd39a;
      --done-bg: #14301f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1620;
    --surface: #172230;
    --line: #263548;
    --ink: #e7edf5;
    --muted: #97a7bb;
    --accent: #4fc3cf;
    --accent-ink: #06222a;
    --done: #6fd39a;
    --done-bg: #14301f;
    color-scheme: dark;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-text);
    padding-block: 28px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  header { display: flex; flex-direction: column; gap: 8px; }
  h1 {
    font-family: var(--font-display);
    font-size: 1.75rem;
    line-height: 1.15;
    margin: 0;
    text-wrap: balance;
  }
  .lede { margin: 0; color: var(--muted); font-size: 1rem; line-height: 1.5; max-width: 60ch; }
  .steps {
    margin: 4px 0 0;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: var(--font-display);
    font-size: 0.9rem;
    line-height: 1.5;
    color: var(--ink);
  }
  .steps b { font-weight: 700; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .card-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  .card-title { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .card-title .kicker {
    font-family: var(--font-display);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .card-title h2 {
    font-family: var(--font-display);
    font-size: 1.1rem;
    margin: 0;
    line-height: 1.25;
  }
  .meta {
    font-family: var(--font-display);
    font-size: 0.8rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .copy {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.95rem;
    min-height: 44px;
    padding: 0 18px;
    border-radius: 8px;
    border: 0;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    flex: 0 0 auto;
  }
  .copy:hover { filter: brightness(1.08); }
  .copy:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .copy.done { background: var(--done-bg); color: var(--done); }

  .script {
    padding: 16px;
    font-size: 1.05rem;
    line-height: 1.65;
    display: flex;
    flex-direction: column;
    gap: 0.9em;
    user-select: text;
    -webkit-user-select: text;
  }
  .script p { margin: 0; max-width: 65ch; }

  .total { color: var(--muted); font-family: var(--font-display); font-size: 0.85rem; margin: 0; }
  @media (prefers-reduced-motion: no-preference) {
    .copy { transition: background 0.15s, color 0.15s; }
  }
</style>

<main>
  <header>
    <h1>Guion de Irán para CapCut</h1>
    <p class="lede">Un solo guion en inglés, con menos de 3.000 caracteres para que entre completo en una capa de texto de CapCut.</p>
    <p class="steps"><b>Cómo usarlo:</b> toca <b>Copiar</b>, pégalo en CapCut en una capa de texto y usa Texto a voz.</p>
  </header>
  <section id="cards" style="display:contents"></section>
  <p class="total" id="total"></p>
</main>

<script>
  // DATA-START
  var CARDS = [
    {
      "title": "Historia completa de Irán",
      "range": "Guion de una sola pieza",
      "text": "2,500 years ago, one man united more peoples than anyone before him, and he did it without destroying their religions. This is the story of Iran, five thousand years in a few minutes.\n\nIt began around 3000 BC with the kingdom of Elam. Later, the Medes built the first Iranian kingdom, and in 612 BC they helped destroy Nineveh, the capital of Assyria.\n\nThen came Cyrus the Great. In 539 BC, he entered Babylon without destroying it, freed deported peoples and respected their gods. A clay cylinder with his decree is considered one of the first documents of tolerance. Darius, who took the throne in 522 BC, divided the empire into provinces, built the Royal Road and founded Persepolis. His empire stretched from Egypt to the Indus Valley.\n\nPersia lost to the Greeks at Marathon in 490 BC. Ten years later, Xerxes invaded and burned Athens, but his fleet was crushed at Salamis. In 331 BC, Alexander the Great defeated Darius the Third and burned Persepolis. The first Persian empire was over.\n\nLater, the Parthians crushed a Roman army at Carrhae in 53 BC. In 224 AD, the Sasanians took over, and Shapur the First captured the Roman emperor Valerian. Zoroastrianism was their official religion. But endless wars with Rome left Persia exhausted, and Arab armies conquered it. In 651, the last Sasanian king died in exile.\n\nIran adopted Islam, but kept its language. Around the year 1010, the poet Ferdowsi finished the Shah-nah-meh, and Persian identity survived. Scientists like Avicenna and poets like Rumi and Hafez made Persia a cultural giant. Then came the Mongols in 1219, and later Tamerlane. Entire cities were razed, and Iran took centuries to recover.\n\nIn 1501, Ismail the First founded the Safavid dynasty and made Shia Islam the state religion. From then on, Iran became the center of Shia Islam. Under Abbas the Great, Iran expelled the Ottomans, and Isfahan became one of the most beautiful cities in the world. In 1739, Nader Shah sacked Delhi and took the famous Peacock Throne.\n\nLater, the Kah-jar kings lost territory to Russia, and a revolution in 1906 forced them to accept a constitution. Oil, discovered in 1908, drew in Britain. In 1925, the Pahlavi dynasty began, and in 1935 the world was asked to say Iran instead of Persia. In 1953, a coup backed by the United States and Britain overthrew Prime Minister Mossadegh.\n\nIn 1979, millions took to the streets, the Shah fled, and Ayatollah Khomeini returned from exile to create the Islamic Republic. Then came eight years of war with Iraq, with hundreds of thousands dead. Khomeini died in 1989, and Ali Khamenei succeeded him as Supreme Leader. Since then, Iran has faced sanctions, protests and tension with its rivals.\n\nFive thousand years of empires, invasions and revolutions. Iran has fallen many times, and many times it has risen again. Which era fascinates you the most? Tell me in the comments."
    }
  ];
  // DATA-END

  var LIMIT = 3000;
  var host = document.getElementById("cards");
  var totalChars = 0;

  function fmt(n) { return n.toLocaleString("es"); }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallbackCopy(text); });
    }
    return Promise.resolve(fallbackCopy(text));
  }

  CARDS.forEach(function (c, i) {
    var count = c.text.length;
    totalChars += count;

    var card = document.createElement("article");
    card.className = "card";

    var head = document.createElement("div");
    head.className = "card-head";

    var title = document.createElement("div");
    title.className = "card-title";
    var kicker = document.createElement("span");
    kicker.className = "kicker";
    kicker.textContent = "Guion final";
    var h2 = document.createElement("h2");
    h2.textContent = c.title;
    var meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = c.range + " · " + fmt(count) + " caracteres";
    title.appendChild(kicker);
    title.appendChild(h2);
    title.appendChild(meta);

    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "copy";
    btn.id = "copy-" + (i + 1);
    btn.textContent = "Copiar";
    btn.addEventListener("click", function () {
      copyText(c.text).then(function (ok) {
        if (ok) {
          btn.textContent = "Copiado";
          btn.classList.add("done");
        } else {
          btn.textContent = "Selecciona el texto";
          var range = document.createRange();
          range.selectNodeContents(body);
          var sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
        }
      });
    });

    head.appendChild(title);
    head.appendChild(btn);

    var body = document.createElement("div");
    body.className = "script";
    c.text.split(/\n\n+/).forEach(function (para) {
      var p = document.createElement("p");
      p.textContent = para;
      body.appendChild(p);
    });

    card.appendChild(head);
    card.appendChild(body);
    host.appendChild(card);
  });

  document.getElementById("total").textContent =
    fmt(totalChars) + " de " + fmt(LIMIT) + " caracteres que permite CapCut por capa de texto.";
</script>
